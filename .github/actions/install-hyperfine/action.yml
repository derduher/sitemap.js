name: 'Install hyperfine'
description: 'Install a pinned hyperfine release binary on a Linux x86_64 runner'

# Distribution packages may still ship hyperfine 1.x, whose JSON export
# bench/to-bmf.mjs doesn't read, so install the release binary instead.
inputs:
  version:
    description: 'hyperfine version'
    default: '2.0.0'
  sha256:
    description: 'SHA-256 of the x86_64-unknown-linux-gnu release tarball for that version'
    default: 'ae2beda2ac99c098427e4f755244552daf20e514422889cca6d44421e2d93c87'

runs:
  using: 'composite'
  steps:
    - name: Install hyperfine
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        name="hyperfine-v${VERSION}-x86_64-unknown-linux-gnu"
        curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
          "https://github.com/sharkdp/hyperfine/releases/download/v${VERSION}/$name.tar.gz"
        echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/$name/hyperfine" --version
