name: Benchmarks (master)

# Records benchmark results for every push to master. This history is the
# baseline every pull request comparison uses. Run it manually several
# times on one commit to seed history faster.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Queue runs rather than overlapping them, so history stays in commit order.
concurrency:
  group: bench-master
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/configure-nodejs
        with:
          node-version: 24.x
      - uses: ./.github/actions/install-hyperfine
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13

      # `npm run bench` builds first.
      - name: Run benchmarks
        run: npm run bench

      # One threshold per measure. Latency, CPU time, and peak RSS regress
      # upward; throughput regresses downward. `_` leaves a boundary unset.
      - name: Track benchmarks with Bencher
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT || 'sitemap-js' }}
        run: |
          bencher run \
            --branch master \
            --testbed ubuntu-latest \
            --adapter json \
            --file bench/results/bmf.json \
            --hash '${{ github.sha }}' \
            --threshold-measure latency --threshold-test t_test \
            --threshold-lower-boundary _ --threshold-upper-boundary 0.99 \
            --threshold-measure cpu-time --threshold-test t_test \
            --threshold-lower-boundary _ --threshold-upper-boundary 0.99 \
            --threshold-measure peak-rss --threshold-test t_test \
            --threshold-lower-boundary _ --threshold-upper-boundary 0.99 \
            --threshold-measure throughput --threshold-test t_test \
            --threshold-lower-boundary 0.99 --threshold-upper-boundary _ \
            --thresholds-reset \
            --error-on-alert \
            --github-actions '${{ secrets.GITHUB_TOKEN }}'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: bench/results/
