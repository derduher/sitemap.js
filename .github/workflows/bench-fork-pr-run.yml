name: Benchmarks (fork pull request, run)

# First half of benchmarking a pull request from a fork. Fork pull requests
# get no secrets and a read-only token, so this workflow only runs the
# benchmarks and uploads the results; bench-fork-pr-track.yml sends them to
# Bencher. Runs only on pull requests with the `performance` label.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: bench-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/configure-nodejs
        with:
          node-version: 24.x
      - uses: ./.github/actions/install-hyperfine

      - name: Run benchmarks
        run: npm run bench

      # The tracking workflow reads the pull request number, branches, and
      # commits from the event payload.
      - name: Save the event payload
        run: cp "$GITHUB_EVENT_PATH" bench/results/event.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-fork-pr
          path: |
            bench/results/bmf.json
            bench/results/event.json
