name: Node CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Lint, formatting and typechecking are identical on every OS and Node
  # version, so they run once rather than on each leg of the test matrix.
  # Typechecking matters more than it used to: tests now run through
  # --experimental-strip-types, which strips types without checking them, so
  # this job is the only thing that typechecks the test suite.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/configure-nodejs
        with:
          node-version: 24.x

      - name: Lint
        run: npm run lint

      - name: Check Formatting with Prettier
        run: npm run prettier

      # Typechecking needs dist/ to exist: tsconfig.json includes tests/, and
      # the tests import from ../dist/*.js.
      - name: Build TypeScript
        run: npm run build

      - name: Typecheck
        run: npm run test:typecheck

  test:
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/configure-nodejs
        with:
          node-version: ${{ matrix.node-version }}

      # `npm run test` builds first, so there is no separate build step here.
      - name: Unit Tests
        run: npm run test

      - name: XML Lint Test
        run: npm run test:xmllint

  # Coverage thresholds are enforced on a single platform: Windows and macOS
  # legs skip the POSIX-shell and xmllint-dependent tests, so their coverage is
  # legitimately lower and would trip the thresholds spuriously.
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/configure-nodejs
        with:
          node-version: 24.x

      # `npm run test:coverage` builds first, so there is no separate build step.
      - name: Unit Tests with Coverage Thresholds
        run: npm run test:coverage

  # Checks that the streaming pipelines finish 1M items under a capped heap
  # and Buffer budget. The heap cap and Buffer accounting behave the same on
  # every platform, so one Linux leg is enough. It takes about a minute,
  # mostly parse-xml reading 1 GB of XML, which is too slow for `npm test`.
  memory:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/configure-nodejs
        with:
          node-version: 24.x

      # `npm run test:memory` builds first, so there is no separate build step.
      - name: Bounded-memory check
        run: npm run test:memory
